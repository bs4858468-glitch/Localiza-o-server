<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GPS de Alta Precisão</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f0f2f5; }
        #mapa {
            width: 100%;
            max-width: 900px;
            height: 500px;
            background-color: #ccc;
            margin: 20px auto;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        button {
            padding: 18px 30px;
            font-size: 20px;
            background-color: #0084ff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active { transform: scale(0.98); }
        #status { margin-top: 15px; font-size: 1.1em; color: #333; }
    </style>
</head>
<body>

    <h2>📍 Localizador de Precisão Máxima</h2>
    <p>Este teste usa GPS + Wi-Fi para achar o ponto exato.</p>
    
    <button onclick="buscarLocalizacaoExata()">ACHAR MEU PONTO NO MAPA</button>
    
    <p id="status">Aguardando comando...</p>
    
    <div id="mapa">O mapa aparecerá aqui após a localização...</div>

    <script>
        function buscarLocalizacaoExata() {
            const status = document.getElementById("status");
            const mapaDiv = document.getElementById("mapa");

            status.innerText = "Conectando aos satélites e escaneando redes...";

            if (!navigator.geolocation) {
                status.innerText = "Erro: Seu aparelho não suporta GPS.";
                return;
            }

            // CONFIGURAÇÕES DE ALTA PRECISÃO
            const configuracoes = {
                enableHighAccuracy: true, // O SEGREDO: Força o uso de GPS/Wi-Fi preciso
                timeout: 15000,           // Espera até 15 segundos pelo sinal
                maximumAge: 0             // Não usa localização antiga gravada no celular
            };

            navigator.geolocation.getCurrentPosition(function(pos) {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const precisao = pos.coords.accuracy; // Margem de erro em metros

                status.innerHTML = `<strong>Localizado!</strong><br> 
                                   Precisão: dentro de ${precisao.toFixed(0)} metros.<br>
                                   Lat: ${lat} | Lon: ${lon}`;

                // Link do Google Maps com Zoom 18 (nível de rua/casa)
                mapaDiv.innerHTML = `<iframe 
                    width="100%" 
                    height="100%" 
                    frameborder="0" 
                    style="border:0; border-radius:15px;"
                    src="https://maps.google.com/maps?q=${lat},${lon}&z=18&output=embed">
                </iframe>`;

            }, function(error) {
                // Tratamento de erros detalhado
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        status.innerText = "Erro: Você precisa permitir o acesso ao GPS.";
                        break;
                    case error.POSITION_UNAVAILABLE:
                        status.innerText = "Erro: Sinal de GPS indisponível no momento.";
                        break;
                    case error.TIMEOUT:
                        status.innerText = "Erro: Demorou demais para encontrar o sinal.";
                        break;
                    default:
                        status.innerText = "Erro desconhecido: " + error.message;
                }
            }, configuracoes);
        }
    </script>
</body>
</html>
