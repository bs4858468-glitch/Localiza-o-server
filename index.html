<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Meu Mapa GPS</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; }
        #mapa {
            width: 100%;
            height: 400px;
            background-color: #eee;
            margin-top: 20px;
            border-radius: 10px;
        }
        button {
            padding: 15px 25px;
            font-size: 18px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>📍 Localização em Tempo Real</h2>
    <button onclick="verMapa()">Mostrar meu lugar no mapa</button>
    
    <p id="status"></p>
    
    <div id="mapa">O mapa aparecerá aqui...</div>

    <script>
        function verMapa() {
            const status = document.getElementById("status");
            const mapaDiv = document.getElementById("mapa");

            status.innerText = "Buscando satélites...";

            if (!navigator.geolocation) {
                alert("Seu navegador não tem GPS");
                return;
            }

            navigator.geolocation.getCurrentPosition(function(pos) {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;

                status.innerText = `Localizado! Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;

                // Criando o mapa usando o Google Maps (via iframe)
                mapaDiv.innerHTML = `<iframe 
                    width="100%" 
                    height="100%" 
                    frameborder="0" 
                    style="border:0; border-radius:10px;"
                    src="https://maps.google.com/maps?q=${lat},${lon}&z=15&output=embed">
                </iframe>`;

            }, function(error) {
                alert("Erro: " + error.message);
            });
        }
    </script>
</body>
</html>
