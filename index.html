<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Mapa GPS - Teste</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        #mapa {
            width: 100%;
            max-width: 800px;
            height: 400px;
            background-color: #ddd;
            margin: 20px auto;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        #status { font-weight: bold; color: #555; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>📍 Teste de Localização em Tempo Real</h2>
    <button onclick="verMapa()">Onde eu estou?</button>
    
    <p id="status">Clique no botão para iniciar.</p>
    
    <div id="mapa">O mapa aparecerá aqui...</div>

    <script>
        function verMapa() {
            const status = document.getElementById("status");
            const mapaDiv = document.getElementById("mapa");

            status.innerText = "Solicitando permissão/Buscando coordenadas...";

            if (!navigator.geolocation) {
                status.innerText = "Erro: Seu navegador não suporta geolocalização.";
                return;
            }

            // Opções para maior precisão
            const options = {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0
            };

            navigator.geolocation.getCurrentPosition(function(pos) {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;

                status.innerText = `Sucesso! Latitude: ${lat.toFixed(5)}, Longitude: ${lon.toFixed(5)}`;

                // URL correta para o embed do Google Maps
                mapaDiv.innerHTML = `<iframe 
                    width="100%" 
                    height="100%" 
                    frameborder="0" 
                    style="border:0; border-radius:15px;"
                    src="https://maps.google.com/maps?q=${lat},${lon}&z=15&output=embed">
                </iframe>`;

            }, function(error) {
                status.innerText = "Erro ao obter localização: " + error.message;
            }, options);
        }
    </script>
</body>
</html>
